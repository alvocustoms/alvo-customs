<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | ALVO Customs</title><link rel="stylesheet" href="style.css"></head><body><div id="siteHeader"></div><main class="container"><section class="page-hero"><div class="eyebrow">YOUR ALVO ACCOUNT</div><h1>My account.</h1><p>Sign in to view your enquiries and order updates.</p></section><section class="auth-wrap"><div class="auth-card" id="authPanel"><h2>Welcome back.</h2><div class="tabs"><button class="active" data-auth-tab="google">Google</button><button data-auth-tab="phone">Mobile OTP</button></div><div id="googleAuth"><button class="btn" id="googleLogin">Continue with Google</button></div><div id="phoneAuth" class="hidden"><form id="phoneForm" class="form"><div class="field"><label>Mobile number</label><input id="phoneNumber" type="tel" inputmode="tel" placeholder="+91 9876543210" required></div><div id="recaptcha-container"></div><button class="btn">Send OTP</button></form><form id="otpForm" class="form hidden"><div class="field"><label>Enter OTP</label><input id="otpCode" inputmode="numeric" required></div><button class="btn">Verify OTP</button></form></div><p class="small">By continuing, you agree to contact from ALVO regarding your enquiries and orders.</p></div><div id="accountContent" class="hidden"></div></section></main><div id="siteFooter"></div><script type="module" src="app.js"></script></body></html>
