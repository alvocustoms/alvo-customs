<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Labels | ALVO Customs</title><link rel="stylesheet" href="style.css"></head><body><div id="siteHeader"></div><main class="container"><section class="page-hero"><div class="eyebrow">MADE AROUND YOU</div><h1>Your label.<br>Your signature.</h1><p>Tell us what you are planning. Our team will connect with you to discuss bottle size, quantity, artwork and delivery.</p></section><section class="section" style="padding-top:0"><div class="panel"><form id="customForm" class="form"><div class="admin-grid"><div class="field"><label>Your name / business</label><input name="name" required placeholder="Name or business name"></div><div class="field"><label>Mobile number</label><input name="phone" required inputmode="tel" placeholder="10-digit mobile number"></div><div class="field"><label>Occasion</label><select name="occasion"><option>Hotel / Restaurant</option><option>Wedding</option><option>Corporate event</option><option>Birthday / Celebration</option><option>Other</option></select></div><div class="field"><label>Bottle size</label><select name="size"><option>250 ml</option><option>500 ml</option><option>1 Litre</option><option>Need guidance</option></select></div><div class="field"><label>Approx. quantity</label><input name="quantity" placeholder="e.g. 30 boxes"></div><div class="field"><label>City</label><input name="city" placeholder="Your city"></div></div><div class="field"><label>Tell us about your label</label><textarea name="message" placeholder="Brand name, design idea, date, delivery details…"></textarea></div><button class="btn" type="submit">Send custom enquiry</button><p class="small">Submitting an enquiry does not confirm an order or payment.</p></form></div></section></main><div id="siteFooter"></div><script type="module" src="app.js"></script></body></html>
