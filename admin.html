<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALVO Admin</title><link rel="stylesheet" href="style.css"></head><body><div id="siteHeader"></div><main class="container admin-shell"><div class="page-hero"><div class="eyebrow">PRIVATE WORKSPACE</div><h1>Admin studio.</h1><p>Manage the catalogue, customer orders and enquiries.</p></div><section id="adminLogin" class="auth-card auth-wrap"><h2>Owner sign in</h2><p>Only the authorised ALVO owner account can access this area.</p><button class="btn" id="adminGoogle">Sign in with Google</button></section><section id="adminApp" class="hidden"><div class="admin-tabs"><button class="active" data-admin-tab="products">Products</button><button data-admin-tab="orders">Orders</button><button data-admin-tab="enquiries">Enquiries</button></div><div id="adminProducts" class="panel"><h2>Product manager</h2><form id="productForm" class="form"><input type="hidden" name="id"><div class="admin-grid"><div class="field"><label>Product name</label><input name="name" required></div><div class="field"><label>Price (₹)</label><input name="price" type="number" min="0" required></div><div class="field"><label>Category</label><select name="category"><option>Hotels</option><option>Wedding</option><option>Events</option><option>Signature</option><option>Restaurant</option></select></div><div class="field"><label>Bottle size</label><select name="size"><option>250 ml</option><option>500 ml</option><option>1 Litre</option></select></div><div class="field"><label>Product image URL</label><input name="image" type="url" placeholder="https://…"></div><div class="field"><label>Product video URL (optional)</label><input name="video" type="url" placeholder="MP4 URL"></div><div class="field"><label>Upload video (max 25 MB)</label><input name="videoFile" type="file" accept="video/mp4,video/webm"></div><div class="field"><label>Upload image</label><input name="imageFile" type="file" accept="image/*"></div></div><div class="field"><label>Short description</label><textarea name="description"></textarea></div><div class="field"><label>Included in price / details</label><textarea name="details" placeholder="Mention GST, transport, custom label and any exclusions accurately."></textarea></div><label><input type="checkbox" name="active" checked> Visible on website</label><button class="btn">Save product</button><button type="button" class="btn btn-outline" id="resetProduct">Clear form</button></form><hr style="border:0;border-top:1px solid var(--line);margin:30px 0"><div id="adminProductList" class="admin-list"></div></div><div id="adminOrders" class="panel hidden"><h2>Customer orders</h2><div id="adminOrderList" class="admin-list">Loading…</div></div><div id="adminEnquiries" class="panel hidden"><h2>Customer enquiries</h2><div id="adminEnquiryList" class="admin-list">Loading…</div></div></section></main><div id="siteFooter"></div><script type="module" src="app.js"></script></body></html>
